[project]
name = "quant"
version = "0.1.0"
description = "Modular locally hosted backtesting framework"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "vectorbt>=0.26",
    "quantstats>=0.0.62",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "data*", "strategies*", "core*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
