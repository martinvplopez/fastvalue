[project]
name = "fastvalue"
version = "0.1.0"
description = "Fast decision desk for a stock portfolio: owner-first scoring with your weights, backtested against buy and hold"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "vectorbt>=0.26",
    "quantstats>=0.0.62",
    "pyarrow>=14.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "config*", "data*", "strategies*", "core*", "analysis*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
